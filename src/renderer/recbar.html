<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com"
    />
    <title>haunt+</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="recbar.css" />
  </head>
  <body>
    <div class="recbar" role="toolbar">
      <span class="dot" id="dot"></span>
      <span class="time" id="time">0:00</span>
      <span class="grip"></span>
      <button type="button" class="b" id="pause"></button>
      <button type="button" class="b stop" id="stop"></button>
      <button type="button" class="b" id="cancel"></button>
    </div>
    <script src="recbar.js"></script>
  </body>
</html>
